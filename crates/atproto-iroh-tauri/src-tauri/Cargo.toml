[package]
name = "atproto-iroh-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Reference Tauri client for atproto-iroh — see ../README.md and ../../../CLAUDE.md's Client section for why Tauri."

[build-dependencies]
tauri-build = "2"

[dependencies]
atproto-iroh-core = { path = "../../atproto-iroh-core" }
iroh-docs = "0.101.0"
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
hex = "0.4.3"
