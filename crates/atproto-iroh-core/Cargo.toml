[package]
name = "atproto-iroh-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "identity, namespace/capability, governance, and mute primitives for the atproto-iroh design in ../../SPEC.md — see CLAUDE.md before extending."

# No longer a stub: SPEC.md's forks (repo/namespace relationship, flat vs
# N-of-M governance, secret-rotation vs mute) are resolved as of this
# scaffold, per §6. Still one crate on purpose — CLAUDE.md's caution
# against a premature multi-crate split; these are modules within it.
[dependencies]
iroh = "1.2.0"
iroh-docs = "0.101.0"
iroh-blobs = "0.103.0"
iroh-gossip = "0.101.0"
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
